name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MODULE_VERSION_CODE: ${{ github.run_number }}
          MODULE_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK contents and signature
        run: |
          set -e
          mkdir -p out
          APK="out/ControlPhoneUnlock-1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "--- xposed entries ---"
          unzip -l "$APK" | grep 'META-INF/xposed/' || (echo "::error::missing META-INF/xposed entries" && exit 1)
          echo "--- signer ---"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControlPhoneUnlock-1.0.${{ github.run_number }}
          path: out/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ControlPhoneUnlock v1.0.${{ github.run_number }}
          body: |
            LSPosed 模块，用于 `com.techbao.controlphone` 1.6.3（libxposed API 102）。

            **原理**：Hook `q0.s.g()`，直接返回 `LICENSED` 状态；不改动原包，签名保持官方，因此小米运动健康的调用方签名校验不受影响。

            **安装**：
            1. 设备已 root 并安装 LSPosed（支持 API 102 的版本）。
            2. 安装本模块 APK，在 LSPosed 中启用，作用域勾选「遥控手机」。
            3. 强制停止「遥控手机」后重新打开。

            **注意**：仅适用于 1.6.3；版本升级后混淆类名可能变化，需要重新适配。
          files: out/*.apk
