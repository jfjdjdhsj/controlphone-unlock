name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the release notes can diff against the previous tag.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Build release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.p12
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MODULE_VERSION_CODE: ${{ github.run_number }}
          MODULE_VERSION_NAME: 1.0.${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK contents and signature
        run: |
          set -e
          mkdir -p out
          APK="out/ControlPhoneUnlock-1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          echo "--- xposed entries ---"
          unzip -l "$APK" | grep 'META-INF/xposed/' || (echo "::error::missing META-INF/xposed entries" && exit 1)
          echo "--- entry class survives R8 ---"
          unzip -p "$APK" 'classes*.dex' | strings | grep -q 'io/github/jfjdjdhsj/controlphone/ModuleMain' \
            || (echo "::error::ModuleMain was stripped or renamed by R8" && exit 1)
          echo "--- size ---"
          du -h "$APK"
          echo "--- signer ---"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Compose release notes
        run: |
          set -e
          APK=$(ls out/*.apk | head -1)
          SIZE=$(du -h "$APK" | cut -f1)
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "**v1.0.${{ github.run_number }}** · ${SIZE} · $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "## 变更"
            echo
            if [ -n "$PREV" ]; then
              git log "${PREV}..HEAD" --no-merges --pretty="- %s (\`%h\`)" | head -40
              echo
              echo "_自 ${PREV} 起_"
            else
              git log --no-merges --pretty="- %s (\`%h\`)" | head -40
            fi
            echo
            echo "## 安装"
            echo
            echo "1. 设备已 root，并安装支持 API 102 的 LSPosed。"
            echo "2. 安装本 APK，在 LSPosed 管理器中启用模块，作用域勾选「遥控手机」。"
            echo "3. 强制停止「遥控手机」后重新打开。"
            echo
            echo "## 适配"
            echo
            echo "仅适配 1.6.3（versionCode 51）。目标应用升级后混淆类名会变化，需重新适配。"
          } > "$RUNNER_TEMP/release_notes.md"
          cat "$RUNNER_TEMP/release_notes.md"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControlPhoneUnlock-1.0.${{ github.run_number }}
          path: out/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ControlPhoneUnlock v1.0.${{ github.run_number }}
          body_path: ${{ runner.temp }}/release_notes.md
          files: out/*.apk
